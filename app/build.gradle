plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.proNutriLog.proteinCalculator'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            keyAlias project.property("KEY_ALIAS")
            keyPassword project.property("KEY_PASSWORD")
            storeFile file(project.property("KEYSTORE_FILE"))
            storePassword project.property("STORE_PASSWORD")
        }
        debug {
            // Debug signing config, usually automatically set up by Android Studio
            storeFile file('path/to/debug.keystore')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Optionally, you can also add debug build types with specific configurations
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    // Define product flavors for different environments
    flavorDimensions += "version"
    productFlavors {
        prod {
            dimension "version"
            applicationId "com.proNutriLog.proteinCalculator"
            versionNameSuffix "-prod"
        }

        dev {
            dimension "version"
            applicationId "com.proNutriLog.proteinCalculator.dev"
            versionNameSuffix "-dev"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
//        dataBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.8' // Use the latest stable version available
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.0'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore:25.1.0' // Firestore library (example)


    // Jetpack Compose dependencies
    implementation 'androidx.compose.ui:ui:1.7.1'
    implementation 'androidx.compose.material:material:1.7.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.1'
    implementation 'androidx.compose.material3:material3-android:1.3.0'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.0.1"
    implementation "androidx.compose.foundation:foundation:1.7.1"
    implementation "androidx.compose.material:material-icons-extended:1.7.1"



    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.code.gson:gson:2.10.1'
}
