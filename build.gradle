// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        //google() // Add Google repository to fetch AGP
        //mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2" // AGP version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0" // Kotlin plugin version
    }
}

plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
}

allprojects {
    repositories {
        //google() // Ensure this is included to resolve Android tools
        //mavenCentral()
    }
}
